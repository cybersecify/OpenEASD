version: 2
updates:
  # Python deps via uv-managed pyproject.toml (pip ecosystem covers this)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      django-stack:
        patterns:
          - "django*"
      tooling:
        patterns:
          - "pytest*"
          - "ruff*"
          - "bandit*"
          - "pip-audit*"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # init + analyze must move together — a split bump leaves the two
      # codeql-action steps on mismatched versions and the Analyze job
      # fails ("Not all workflow steps ... use the same version").
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "ci"

  # Docker base image (ubuntu:24.04) — security-only would be safer but
  # we want to know when the upstream major bumps too.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
