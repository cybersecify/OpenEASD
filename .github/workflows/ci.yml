name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    # No paths-ignore: CI is now a REQUIRED status check, so a PR touching only
    # ignored paths (**.md, docs/**) would never run it → the required check never
    # reports → the PR is unmergeable. Run CI on every PR; the `push` paths-ignore
    # above still skips the image republish on docs-only merges to main.
    branches: ["main"]
  # Weekly rebuild so the baked nuclei-templates refresh on cadence — the image
  # sets -disable-update-check (no runtime template fetch), so without this the
  # templates freeze at build time and rot (miss new CVEs). schedule runs on the
  # default branch, so the publish job pushes a fresh :latest. See
  # docs/SCAN_OPERATIONAL_LEARNINGS.md.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Security Scan
    runs-on: ubuntu-24.04

    # PostgreSQL service — the app + DBOS run on Postgres now (no SQLite). The
    # test suite creates its test database here; pytest-django + DBOS both need it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openeasd
          POSTGRES_USER: openeasd
          POSTGRES_PASSWORD: openeasd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openeasd -d openeasd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libcairo2-dev gcc libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests (fast — exclude slow DNS tests)
        env:
          SECRET_KEY: "ci-test-secret-key-not-used-in-prod"
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: openeasd
          DB_USER: openeasd
          DB_PASSWORD: openeasd
        run: uv run pytest tests/ --ignore=tests/unit/test_domain_security.py -q

      - name: SAST — bandit
        run: uv run bandit -r apps/ openeasd/ -ll -x tests/
        # -ll = LOW+ severity only (skip INFO noise); -x = exclude test dirs

      - name: Dependency vulnerability scan — pip-audit
        run: uv run pip-audit --ignore-vuln PYSEC-2025-183
        # PYSEC-2025-183 (pyjwt weak key length) is disputed by PyJWT maintainers — no fix available

  frontend:
    name: Frontend Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [web, worker]   # two images now: slim web + Ubuntu worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build ${{ matrix.target }} image (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-24.04
    needs: [test, frontend, docker]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, worker]   # publish both images: openeasd-web + openeasd-worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/cybersecify/openeasd-${{ matrix.target }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute build provenance
        id: prov
        run: |
          # Version: git tag for v* builds (strip the leading v), else the
          # pyproject.toml [project] version for main-branch :latest builds.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          fi
          {
            echo "version=${version}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.target }} (amd64 + arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENEASD_VERSION=${{ steps.prov.outputs.version }}
            OPENEASD_GIT_SHA=${{ github.sha }}
            OPENEASD_BUILD_DATE=${{ steps.prov.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          # Supply-chain transparency: SBOM + SLSA provenance baked into the
          # image manifest. Retrieve with:
          #   docker buildx imagetools inspect ghcr.io/cybersecify/openeasd:vX.Y --format '{{ json . }}'
          # SBOM lists every package in the image; provenance attests the build.
          sbom: true
          provenance: mode=max
