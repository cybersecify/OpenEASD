name: CodeQL

# CodeQL scans Python (the Django app) for security anti-patterns: SQL
# injection, XSS, hardcoded secrets,
# unsafe deserialisation, dataflow vulnerabilities. Findings appear in the
# Security tab. Complements bandit (already in ci.yml) — bandit does pattern
# matching, CodeQL does semantic dataflow analysis.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly even without commits to catch newly-discovered CWE patterns
    # against unchanged code. Monday 04:00 UTC = quiet time for CI runners.
    - cron: "0 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          # Kept to match main's CodeQL config (a required status check compares the
          # two); there is no JS/TS left after the React SPA removal, so this scans an
          # empty set. Drop it only together with the branch-protection requirement.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # default query suite — security-extended would catch more but is
          # noisier; we can flip later if the default suite is too quiet
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v3
        with:
          category: "/language:${{ matrix.language }}"
