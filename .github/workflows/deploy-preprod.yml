# Auto-deploy the latest release to PREPROD (self-hosted runner + on-host GitOps).
#
# WHY this shape: preprod is single-node microk8s behind a private network, so a
# GitHub-hosted runner can't reach it. A SELF-HOSTED runner on the preprod host
# (label `preprod`) runs the deploy with the cluster's own kubectl.
#
# Preprod's desired state lives in a SEPARATE private infra repo ON THE HOST
# (PREPROD_INFRA_DIR), in its `apps/openeasd/` kustomize overlay (namespace
# preprod, NodePort service, image pins). That overlay — NOT the upstream `k8s/`
# base (which is PROD-only, namespace default) — is preprod's source of truth. So
# the deploy step BUMPS THE PINS IN THAT REPO, COMMITS, and `apply -k`s it, instead
# of `kubectl set image`. This kills the drift trap: with set-image the cluster
# diverged from the overlay, and any later `apply -k` from the infra repo silently
# rolled preprod back to the overlay's stale pin (observed twice: v2.16.0, v2.18.0).
# The infra repo has NO REMOTE — it lives only on this host — so the commit is
# purely local; there is no protected-branch / push concern. Migration-safe:
# kustomize rewrites the init container image alongside web, so migrate runs on the
# new code (unlike `set image web=…`, which leaves init on the old image).
#
# SAFETY: pg_dump backup BEFORE deploy (the web init container migrates on
# rollout), then verify /health reports the new version, else fail for rollback.
#
# ONE-TIME SETUP on the preprod host:
#   1. Register the runner (repo → Settings → Actions → Runners → New self-hosted):
#        ./config.sh --url https://github.com/cybersecify/OpenEASD \
#                    --token <REG_TOKEN> --labels preprod
#        sudo ./svc.sh install && sudo ./svc.sh start
#   2. The runner user (e.g. gha-runner) needs: `microk8s kubectl -n preprod get
#      pods` to work, WRITE access to the infra repo dir (add it to the owning
#      group, or move the repo to a shared path), and a `kustomize` binary on PATH.
#   3. Repo → Settings → Secrets and variables → Actions → Variables:
#        PREPROD_INFRA_DIR = /abs/path/to/the/infra/repo   (required)
#        KUBECTL           = "microk8s kubectl"            (if that's your kubectl)
#        KUSTOMIZE         = kustomize                      (optional; default `kustomize`)
#
# PROD is intentionally NOT covered here — it stays on the manual upstream
# `k8s/kustomization.yaml` newTag bump + `kubectl apply -k k8s/` promote.

name: Deploy to preprod

on:
  release:
    types: [published]          # fires when the v* tag flow publishes a GitHub Release
  workflow_dispatch:            # manual re-deploy of a specific tag
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v2.20.0)"
        required: true

concurrency:
  group: deploy-preprod         # never let two deploys race
  cancel-in-progress: false

env:
  NAMESPACE: preprod
  WEB_IMAGE: ghcr.io/cybersecify/openeasd-web
  WORKER_IMAGE: ghcr.io/cybersecify/openeasd-worker
  # NodePort + Host used to verify /health from the preprod host (Caddy → NodePort).
  NODE_PORT: "30808"
  HEALTH_HOST: openeasd.local
  # Where pg_dump backups land on the preprod host. Keep on a persistent path.
  BACKUP_DIR: "${HOME}/openeasd-backups"

jobs:
  deploy:
    runs-on: [self-hosted, preprod]
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then echo "No tag resolved"; exit 1; fi
          case "$TAG" in v*) ;; *) echo "Refusing non-release tag '$TAG' (must start with v)"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG to namespace $NAMESPACE"

      - name: Resolve tools
        id: tools
        run: |
          echo "kubectl=${KUBECTL:-kubectl}" >> "$GITHUB_OUTPUT"
          echo "kustomize=${KUSTOMIZE:-kustomize}" >> "$GITHUB_OUTPUT"
        env:
          KUBECTL: ${{ vars.KUBECTL }}
          KUSTOMIZE: ${{ vars.KUSTOMIZE }}

      - name: Backup database (pg_dump) BEFORE deploy
        env:
          KUBECTL: ${{ steps.tools.outputs.kubectl }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          OUT="$BACKUP_DIR/preprod-${TAG}-${{ github.run_id }}.sql"
          echo "Dumping to $OUT"
          # Creds live in the postgres pod's env (POSTGRES_USER/POSTGRES_DB); no secrets in CI.
          $KUBECTL exec -n "$NAMESPACE" statefulset/openeasd-postgres -c postgres -- \
            sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$OUT"
          test -s "$OUT" || { echo "Backup is empty — aborting deploy"; exit 1; }
          echo "Backup OK ($(wc -c < "$OUT") bytes)"

      - name: Deploy — bump the infra-repo overlay in Git, then apply -k
        env:
          KUBECTL: ${{ steps.tools.outputs.kubectl }}
          KUSTOMIZE: ${{ steps.tools.outputs.kustomize }}
          TAG: ${{ steps.tag.outputs.tag }}
          INFRA_DIR: ${{ vars.PREPROD_INFRA_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${INFRA_DIR:-}" ]; then
            echo "PREPROD_INFRA_DIR repo variable is not set — cannot locate the preprod overlay"; exit 1
          fi
          OVERLAY="$INFRA_DIR/apps/openeasd"
          test -f "$OVERLAY/kustomization.yaml" || { echo "No kustomization.yaml at $OVERLAY"; exit 1; }

          # 1. Re-pin both images to the release tag IN GIT (the overlay is preprod's
          #    source of truth). kustomize rewrites the images list; both images move
          #    to the same release tag. (Pins by tag — the release tags are immutable.
          #    To keep digest pins instead, resolve TAG→digest and use name@sha here.)
          ( cd "$OVERLAY" && \
            $KUSTOMIZE edit set image \
              "${WEB_IMAGE}=${WEB_IMAGE}:${TAG}" \
              "${WORKER_IMAGE}=${WORKER_IMAGE}:${TAG}" )

          # 2. Commit locally — this repo has no remote; Git-on-host is the record of
          #    what preprod runs, so a later `apply -k` can never roll it back.
          if git -C "$INFRA_DIR" diff --quiet -- apps/openeasd/kustomization.yaml; then
            echo "overlay already pinned to ${TAG} — nothing to commit"
          else
            git -C "$INFRA_DIR" \
              -c user.name="preprod-cd" -c user.email="preprod-cd@localhost" \
              commit -m "deploy: openeasd ${TAG} to preprod" -- apps/openeasd/kustomization.yaml
          fi

          # 3. Apply the committed overlay. kustomize sets init + web + worker images
          #    together → migrate runs on the new code (migration-safe).
          $KUBECTL apply -k "$OVERLAY"
          $KUBECTL rollout status -n "$NAMESPACE" deployment/openeasd-web    --timeout=300s
          $KUBECTL rollout status -n "$NAMESPACE" deployment/openeasd-worker --timeout=300s

      - name: Verify /health reports the new version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          GOT="$(curl -fsS --max-time 15 -H "Host: ${HEALTH_HOST}" \
            "http://localhost:${NODE_PORT}/health/" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version",""))')"
          echo "health version=$GOT expected=$VERSION"
          [ "$GOT" = "$VERSION" ] || { echo "Version mismatch — rollback with: kubectl rollout undo deployment/openeasd-web deployment/openeasd-worker -n ${NAMESPACE}"; exit 1; }
          echo "preprod is now on $VERSION"
