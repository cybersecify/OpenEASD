services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openeasd
      POSTGRES_USER: openeasd
      POSTGRES_PASSWORD: "change-me-in-production"
    volumes:
      - openeasd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openeasd -d openeasd"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      target: web          # slim image, no scanner tools
    ports:
      - "8000:8000"
    volumes:
      - openeasd_logs:/app/logs
    environment: &app_env
      OPENEASD_ROLE: "web"          # this container owns migrations/collectstatic/admin
      SECRET_KEY: "change-me-in-production"
      DEBUG: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      # PostgreSQL (DBOS system tables share this DB in a `dbos` schema)
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "openeasd"
      DB_USER: "openeasd"
      DB_PASSWORD: "change-me-in-production"
      # DBOS scan concurrency (Postgres has no single-writer lock)
      DBOS_SCAN_CONCURRENCY: "2"
      # Cloudflare Workers AI (optional — off unless set; or enter in the UI)
      # CLOUDFLARE_ACCOUNT_ID: ""
      # CLOUDFLARE_API_TOKEN: ""
      # Tool paths
      TOOL_SUBFINDER: "/usr/local/bin/pdtm-tools/subfinder"
      TOOL_DNSX: "/usr/local/bin/pdtm-tools/dnsx"
      TOOL_NAABU: "/usr/local/bin/pdtm-tools/naabu"
      TOOL_HTTPX: "/usr/local/bin/pdtm-tools/httpx"
      TOOL_NUCLEI: "/usr/local/bin/pdtm-tools/nuclei"
      TOOL_AMASS: "/usr/local/bin/amass"
      TOOL_NMAP: "nmap"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker       # full image with nmap + scanner tools
    # DBOS durable-execution worker: executes scan/AI workflows + runs the
    # @scheduled cron workflows. NET_RAW needed for nmap/naabu raw sockets.
    cap_add:
      - NET_RAW
    volumes:
      - openeasd_logs:/app/logs
    environment:
      <<: *app_env
      OPENEASD_ROLE: "worker"       # skips migrations; waits for web to apply them
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openeasd_pgdata:
  openeasd_logs:
