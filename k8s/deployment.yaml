apiVersion: apps/v1
kind: Deployment
metadata:
  name: openeasd
  namespace: default
  labels:
    app: openeasd
spec:
  # App data is in PostgreSQL now (postgres.yaml), so this pod is stateless
  # apart from the RWO logs PVC. Kept at replicas:1 with one web + one worker
  # container; to scale, split web and worker into separate Deployments (the
  # DBOS worker supports multiple replicas pulling the same Postgres queue).
  replicas: 1
  # Recreate: the logs PVC is RWO, so a rolling update would deadlock the new
  # pod on the volume. Recreate tears the old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openeasd
  template:
    metadata:
      labels:
        app: openeasd
    spec:
      initContainers:
        - name: init
          image: ghcr.io/cybersecify/openeasd-web:latest
          # Always re-pull: the :latest tag is mutable, so a deploy that doesn't
          # change the tag string must still fetch the new digest. Without this,
          # k8s defaults to IfNotPresent semantics against the cached image and
          # silently keeps running the old build.
          imagePullPolicy: Always
          command: ["./docker-entrypoint.sh", "true"]
          envFrom:
            - configMapRef:
                name: openeasd-config
            - secretRef:
                name: openeasd-secret
          volumeMounts:
            - name: logs
              mountPath: /app/logs

      containers:
        - name: web
          image: ghcr.io/cybersecify/openeasd-web:latest
          imagePullPolicy: Always
          command:
            - gunicorn
            - openeasd.wsgi:application
            - --bind
            - "0.0.0.0:8000"
            - --workers
            - "2"
            - --timeout
            - "120"
            - --access-logfile
            - "-"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: openeasd-config
            - secretRef:
                name: openeasd-secret
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: openeasd.local
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: openeasd.local
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

        - name: worker
          image: ghcr.io/cybersecify/openeasd-worker:latest
          imagePullPolicy: Always
          # DBOS durable-execution worker: runs scan/AI workflows + the
          # @scheduled cron workflows. The init container has already applied
          # migrations before this starts, so it launches against a ready schema.
          command:
            - python
            - manage.py
            - dbos_worker
          envFrom:
            - configMapRef:
                name: openeasd-config
            - secretRef:
                name: openeasd-secret
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          securityContext:
            capabilities:
              add:
                - NET_RAW   # required for nmap and naabu port scanning
          # nuclei loads ~10k community templates into memory at scan time,
          # which spikes well past 1Gi. At the old 1Gi limit the kernel
          # OOM-killed the worker mid-scan (exit 137) — proc.wait() never
          # returned, so the scan orphaned "running" until the 240m watchdog
          # reaped it as partial. Raised to 4Gi (node has ~52Gi free) so the
          # template load fits and full scans complete.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: openeasd-logs
