apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
images:
  # Pin the single image to a released version for reproducible rollouts. Bump
  # per release (or switch to the floating :v3.0 major.minor tag +
  # imagePullPolicy: Always to auto-pick-up patch releases). This is the SINGLE
  # source of truth for which version prod runs; rollback = set the tag back and
  # re-apply. Never pin prod to :latest.
  - name: ghcr.io/cybersecify/openeasd
    newTag: v3.0.1
resources:
  - configmap.yaml
  - pvc.yaml
  - app-deployment.yaml
  - service.yaml
# ingress.yaml is omitted — Caddy on the host terminates TLS and proxies to the
# NodePort (service.yaml). Re-add the ingress + a controller (e.g. nginx-ingress)
# if you want in-cluster ingress instead.
# secret.yaml is intentionally NOT listed above — it is applied separately with
# real values that must never be committed, and keeping it out of the base means
# `kubectl apply -k k8s/` can never overwrite it. The secret holds SECRET_KEY,
# DB_PASSWORD, AND the real ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS (configmap.yaml
# carries only placeholders; secretRef overrides configMapRef in the deployment
# envFrom). Apply it out-of-band, e.g.:
#   kubectl create secret generic openeasd-secret -n default \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=ALLOWED_HOSTS="your.host,openeasd.local,localhost" \
#     --from-literal=CSRF_TRUSTED_ORIGINS="https://your.host"
