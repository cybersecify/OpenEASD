# App data now lives in PostgreSQL (see postgres.yaml) — there is no SQLite PVC.
# Only the logs volume remains for the web + worker containers.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openeasd-logs
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
