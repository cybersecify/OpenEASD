apiVersion: v1
kind: Service
metadata:
  name: openeasd
  namespace: default
  labels:
    app: openeasd
spec:
  # Target the web tier only — the worker Deployment shares app: openeasd but
  # has no :8000 listener, so the selector must pin tier: web.
  selector:
    app: openeasd
    tier: web
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30808
  type: NodePort
