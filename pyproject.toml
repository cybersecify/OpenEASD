[project]
name = "openeasd"
version = "2.0.0"
description = "OpenEASD - Automated External Attack Surface Detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Rathnakara G N", email = "contact@cybersecify.com"},
]
dependencies = [
    # Web framework
    "django>=5.2.17",
    "django-ninja>=1.6.2",
    # Configuration
    "python-decouple>=3.8",
    # DNS / network
    "dnspython>=2.4",
    "requests>=2.31",
    "pyyaml>=6.0",
    # SSL / crypto / SSH
    # floor raised to 50.0 for CVE-2026-69247 (fixed in 50.0.0)
    "cryptography>=50.0",
    "paramiko>=5.0.0",
    # Reports (PDF generation) — WeasyPrint renders full CSS (backgrounds,
    # @page rules, rounded corners); needs pango/gdk-pixbuf system libs.
    "weasyprint>=63",
    # Task queue
    "croniter>=2.0",
    # XML parsing (safe)
    "defusedxml>=0.7.1",
    # Auth
    "django-ninja-jwt>=5.0",
    "whitenoise>=6.7",
    "lxml>=6.1.0",
    "pypdf>=6.15",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "psycopg[binary]>=3.2",
    "dbos>=0.26",
    "dj-database-url>=2.2",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=21.2",
]

[project.scripts]
openeasd = "apps.core.scans.management.commands.run_scan:Command"
openeasd-daily = "apps.core.scans.management.commands.run_daily_scan:Command"
openeasd-weekly = "apps.core.scans.management.commands.run_weekly_scan:Command"

[tool.setuptools.packages.find]
include = ["apps*", "openeasd*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "black>=23.11",
    "ruff>=0.4",
    "mypy>=1.7",
    "isort>=5.12",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "openeasd.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Migrations are auto-generated; don't lint them.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# High-signal correctness rules only for now. E501 (line length) and import
# ordering are left to a future formatter-adoption pass so this gate stays a
# small, mechanical-diff-free correctness check rather than a 200-file reformat.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length — deferred to formatter adoption
]

[tool.ruff.lint.per-file-ignores]
# Intentional late/deferred imports: Django settings run import-time side
# effects, AppConfig.ready() wiring, and the DBOS modules defer imports to
# break registration cycles — E402 is a false positive in these.
"openeasd/settings.py" = ["E402"]
"**/apps.py" = ["E402"]
"apps/core/durable/**" = ["E402"]
"manage.py" = ["E402"]
# Routers are imported AFTER the NinjaAPI instance is built, on purpose
# (each router module imports back from here) — the ordering is load-bearing.
"apps/core/api/ninja.py" = ["E402"]
